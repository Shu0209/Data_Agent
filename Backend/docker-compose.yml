name: data-agent


services:
  db:
    image: postgres:16-alpine
    container_name: data-agent-db
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  data_agent_backend:
    image: data-agent-backend:latest
    container_name: data-agent-backend

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - DB_HOST=db
      - DB_PORT=5432

volumes:
  pgdata: