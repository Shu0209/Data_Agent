[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "logfire[fastapi,system-metrics]>=5.6.0",
    "nemoguardrails>=0.24.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "slowapi>=0.1.10",
    "sqlglot>=30.30.0",
    "uvicorn[standard]>=0.54.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
